# Training hyperparameters.

epochs: 150
batch_size: 1
accumulation_steps: 8        # Effective batch size = batch_size * accumulation_steps
num_workers: 4
pin_memory: true
prefetch_factor: 2

amp: true                    # Mixed precision (autocast; GradScaler on CUDA only)
# Gradient checkpointing is a model setting: model.gradient_checkpointing

optimizer:
  name: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-5

scheduler:
  name: reduce_on_plateau
  patience: 12
  factor: 0.5
  min_lr: 1.0e-6

loss:
  # generalized_dice_focal = MONAI GeneralizedDiceFocalLoss (used for the
  # bundled checkpoint) | dice_focal = MONAI DiceFocalLoss
  name: generalized_dice_focal
  include_background: true
  to_onehot_y: true
  softmax: true
  lambda_dice: 1.0           # Weight of the (generalized) Dice term
  lambda_focal: 0.2
  focal_gamma: 2.0

augmentation:
  flip_prob: 0.5
  rotate_prob: 0.5
  affined_prob: 0.3

logging:
  val_interval: 1            # Run validation every N epochs
  save_best: true            # Save the best checkpoint by validation Dice
